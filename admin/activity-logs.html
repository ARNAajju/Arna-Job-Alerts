<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Activity Logs | Arna Admin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">

</head>

<body class="bg-light">

<div class="container py-4">

<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">

<h2 class="mb-0">Activity Logs</h2>

<div class="d-flex gap-2">
<button type="button" id="clearLogsBtn" class="btn btn-outline-danger">
Clear All Logs
</button>
<a href="dashboard.html" class="btn btn-secondary">
Dashboard
</a>
</div>

</div>

<div class="card shadow mb-4">
<div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
<span>Recent Activity</span>
<span class="small" id="logCountLabel">Showing last 100</span>
</div>
<div class="card-body">
<div class="table-responsive">
<table class="table table-bordered table-striped mb-0">
<thead>
<tr>
<th>Time</th>
<th>Email</th>
<th>Action</th>
<th>Module</th>
<th>Title</th>
<th>Details</th>
</tr>
</thead>
<tbody id="activityLogsBody">
<tr><td colspan="6" class="text-muted">Loading…</td></tr>
</tbody>
</table>
</div>
</div>
</div>

</div>

<script type="module" src="activity-logs.js"></script>
<script type="module" src="auth.js"></script>

</body>
</html>
