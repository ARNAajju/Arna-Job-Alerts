<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Edit Job</title>

<script>
(function () {
    var params = new URLSearchParams(window.location.search);
    var id = params.get("id") || params.get("edit") || "";
    var target = "add-job-card.html";
    if (id) {
        target += "?edit=" + encodeURIComponent(id);
    }
    window.location.replace(target);
})();
</script>

</head>

<body class="bg-light">

<div class="container mt-5">
    <p>Opening the full Edit Job form…</p>
    <p>
        <a id="editJobFallback" href="add-job-card.html">Continue to Add / Edit Job</a>
    </p>
</div>

<script type="module" src="edit-job.js"></script>

</body>

</html>
