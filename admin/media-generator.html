<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Generator | Arna Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light">

<div class="container py-4">

<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
<h2 class="mb-0">Media Generator</h2>
<div class="d-flex gap-2">
<a href="ai-assistant.html" class="btn btn-outline-primary">AI Assistant</a>
<a href="dashboard.html" class="btn btn-secondary">Dashboard</a>
</div>
</div>

<div class="card shadow mb-4">
<div class="card-header bg-primary text-white">Load Job or Enter Details</div>
<div class="card-body">
<div class="row g-3">
<div class="col-md-8">
<label class="form-label">Select published / draft job</label>
<select id="jobSelect" class="form-select">
<option value="">— Manual entry —</option>
</select>
</div>
<div class="col-md-4 d-flex align-items-end">
<button type="button" id="loadJobBtn" class="btn btn-outline-secondary w-100">Load Job</button>
</div>
<div class="col-md-12">
<label class="form-label">Title</label>
<input type="text" id="title" class="form-control">
</div>
<div class="col-md-4">
<label class="form-label">Department</label>
<input type="text" id="department" class="form-control">
</div>
<div class="col-md-4">
<label class="form-label">Last Date</label>
<input type="text" id="lastDate" class="form-control" placeholder="YYYY-MM-DD">
</div>
<div class="col-md-4">
<label class="form-label">Apply / Job URL</label>
<input type="url" id="applyUrl" class="form-control">
</div>
<div class="col-12">
<button type="button" id="generateBtn" class="btn btn-success">Generate All Captions</button>
<span id="status" class="ms-2 text-muted small"></span>
</div>
</div>
</div>
</div>

<div class="row g-3">
<div class="col-lg-6">
<label class="form-label">Thumbnail Prompt</label>
<textarea id="thumbnailPrompt" rows="4" class="form-control"></textarea>
</div>
<div class="col-lg-6">
<label class="form-label">Instagram Caption</label>
<textarea id="instagramCaption" rows="4" class="form-control"></textarea>
</div>
<div class="col-lg-6">
<label class="form-label">Telegram Message</label>
<textarea id="telegramMessage" rows="4" class="form-control"></textarea>
</div>
<div class="col-lg-6">
<label class="form-label">WhatsApp Message</label>
<textarea id="whatsappMessage" rows="4" class="form-control"></textarea>
</div>
<div class="col-lg-6">
<label class="form-label">Facebook Post</label>
<textarea id="facebookPost" rows="4" class="form-control"></textarea>
</div>
<div class="col-lg-6">
<label class="form-label">Twitter / X Post</label>
<textarea id="twitterPost" rows="4" class="form-control"></textarea>
</div>
<div class="col-lg-6">
<label class="form-label">YouTube Title</label>
<input type="text" id="youtubeTitle" class="form-control">
</div>
<div class="col-lg-6">
<label class="form-label">YouTube Description</label>
<textarea id="youtubeDescription" rows="4" class="form-control"></textarea>
</div>
</div>

<div class="mt-3 d-flex flex-wrap gap-2">
<button type="button" id="copyAllBtn" class="btn btn-dark">Copy All</button>
<button type="button" id="saveMediaBtn" class="btn btn-primary">Save to Job (media fields)</button>
</div>

</div>

<script type="module" src="media-generator.js"></script>
<script type="module" src="auth.js"></script>

</body>
</html>
