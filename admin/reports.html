<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reports | Arna Admin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">

</head>

<body class="bg-light">

<div class="container py-4">

<div class="d-flex justify-content-between align-items-center mb-4">

<h2>Reports</h2>

<a href="dashboard.html" class="btn btn-secondary">
Dashboard
</a>

</div>

<!-- Counts -->
<div class="row g-3 mb-4">

<div class="col-md-3">
<div class="card shadow">
<div class="card-body text-center">
<div class="text-muted small">Jobs</div>
<h3 id="countJobs" class="mb-0">—</h3>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card shadow">
<div class="card-body text-center">
<div class="text-muted small">Results</div>
<h3 id="countResults" class="mb-0">—</h3>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card shadow">
<div class="card-body text-center">
<div class="text-muted small">Hall Tickets</div>
<h3 id="countHalltickets" class="mb-0">—</h3>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card shadow">
<div class="card-body text-center">
<div class="text-muted small">Schemes</div>
<h3 id="countSchemes" class="mb-0">—</h3>
</div>
</div>
</div>

</div>

<!-- Export -->
<div class="card shadow mb-4">
<div class="card-header bg-primary text-white">
Export Data
</div>
<div class="card-body">
<div class="d-flex flex-wrap gap-2">
<button type="button" id="exportJobsCsv" class="btn btn-outline-primary">Export Jobs CSV</button>
<button type="button" id="exportResultsCsv" class="btn btn-outline-primary">Export Results CSV</button>
<button type="button" id="exportHallticketsCsv" class="btn btn-outline-primary">Export Hall Tickets CSV</button>
<button type="button" id="exportSchemesCsv" class="btn btn-outline-primary">Export Schemes CSV</button>
<button type="button" id="exportFullJson" class="btn btn-success">Full JSON Backup</button>
</div>
</div>
</div>

<!-- Status table -->
<div class="card shadow mb-4">
<div class="card-header bg-primary text-white">
Counts by Status
</div>
<div class="card-body">
<div class="table-responsive">
<table class="table table-bordered table-striped mb-0">
<thead>
<tr>
<th>Collection</th>
<th>Status</th>
<th>Count</th>
</tr>
</thead>
<tbody id="statusTableBody">
<tr><td colspan="3" class="text-muted">Loading…</td></tr>
</tbody>
</table>
</div>
</div>
</div>

</div>

<script type="module" src="reports.js"></script>
<script type="module" src="auth.js"></script>

</body>
</html>
