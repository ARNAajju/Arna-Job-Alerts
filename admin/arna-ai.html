<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arna AI | Arna Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light">

<div class="container py-4">

<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
<h2 class="mb-0">🤖 Arna AI</h2>
<div class="d-flex gap-2 flex-wrap">
<a href="settings.html" class="btn btn-outline-secondary">Settings</a>
<a href="dashboard.html" class="btn btn-secondary">Dashboard</a>
</div>
</div>

<div class="alert alert-info">
<strong>Research Assistant only.</strong>
Not a scanner, OCR, crawler, or auto-publisher.
Suggestions never publish — Admin must review and click Publish on Add Job.
</div>

<div class="card shadow mb-4">
<div class="card-body">
<label class="form-label">Research query</label>
<textarea id="aiQuery" class="form-control mb-3" rows="3" placeholder="Today's AP Jobs / Railway Jobs / Degree Jobs / Private Jobs / Engineering Jobs / Medical Jobs"></textarea>
<div class="d-flex flex-wrap gap-2">
<button type="button" id="runAiBtn" class="btn btn-primary">Research</button>
<button type="button" id="clearAiBtn" class="btn btn-outline-secondary">Clear</button>
</div>
<p id="aiStatus" class="small text-muted mt-3 mb-0">Configure AI provider + API key in Settings before researching.</p>
</div>
</div>

<div id="aiResults" class="row g-3"></div>

</div>

<script type="module" src="auth.js"></script>
<script type="module" src="arna-ai.js"></script>

</body>
</html>
