<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifications | Arna Admin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">

</head>

<body class="bg-light">

<div class="container py-4">

<div class="d-flex justify-content-between align-items-center mb-4">

<h2>

🔔 Send Notifications

</h2>

<a
href="dashboard.html"
class="btn btn-secondary">

Dashboard

</a>

</div>

<form id="notificationForm">

<input type="hidden" id="notificationId">

<div class="card shadow">

<div class="card-header bg-primary text-white">

Compose Notification

</div>

<div class="card-body">

<div class="mb-3">

<label class="form-label">

Notification Title

</label>

<input
type="text"
id="title"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">

Message

</label>

<textarea
id="message"
rows="5"
class="form-control"
required></textarea>

</div>

<div class="mb-3">

<label class="form-label">

Target Audience

</label>

<select
id="target"
class="form-select">

<option value="all">

All Users

</option>

<option value="jobs">

Job Followers

</option>

<option value="results">

Results Followers

</option>

<option value="halltickets">

Hall Ticket Followers

</option>

<option value="schemes">

Scheme Followers

</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">

Priority

</label>

<select
id="priority"
class="form-select">

<option value="low">

Low

</option>

<option value="normal" selected>

Normal

</option>

<option value="high">

High

</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">

Notification Image (Optional)

</label>

<input
type="text"
id="image"
class="form-control"
placeholder="https://...">

</div>

<button
type="submit"
id="submitBtn"
class="btn btn-success">

Send Notification

</button>

</div>

</div>

</form>

<hr class="my-5">

<div class="card shadow">

<div class="card-header bg-dark text-white">

Notification History

</div>

<div class="card-body">

<div class="table-responsive">

<table class="table table-bordered table-hover">

<thead>

<tr>

<th>Title</th>

<th>Target</th>

<th>Priority</th>

<th>Read</th>

<th>Date</th>

<th>Status</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="notificationTable">

<tr>

<td colspan="7" class="text-center">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

</div>

<script type="module" src="auth.js"></script>
<script type="module" src="notifications.js"></script>

</body>

</html>
