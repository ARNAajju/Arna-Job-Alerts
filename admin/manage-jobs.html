<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Manage Jobs</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">

<h2 class="mb-0">
📋 Manage Jobs
</h2>

<a
href="dashboard.html"
class="btn btn-secondary">

⬅ Dashboard

</a>

</div>

<!-- Search & Filters -->

<div class="row mb-4">

<div class="col-md-3 mb-2">

<input
type="text"
id="searchJob"
class="form-control"
placeholder="🔍 Search Jobs">

</div>

<div class="col-md-3 mb-2">

<select
id="filterState"
class="form-select">

<option value="">All States</option>

<option value="AP">Andhra Pradesh</option>

<option value="TS">Telangana</option>

<option value="Central">Central Government</option>

<option value="Other">Other States</option>

</select>

</div>

<div class="col-md-3 mb-2">

<select
id="filterCategory"
class="form-select">

<option value="">All Categories</option>

<option>AP Government</option>

<option>TS Government</option>

<option>Central Government</option>

<option>Private Jobs</option>

<option>Railway</option>

<option>Bank</option>

<option>Police</option>

<option>Teaching</option>

<option>Medical</option>

<option>Engineering</option>

<option>Defence</option>

<option>Apprenticeship</option>

<option>Contract</option>

<option>Walk-in</option>

</select>

</div>

<div class="col-md-2 mb-2">

<select id="sortJobs" class="form-select">
<option value="newest">Newest First</option>
<option value="title-asc">Title A-Z</option>
<option value="title-desc">Title Z-A</option>
<option value="lastDate">Last Date</option>
</select>

</div>

<div class="col-md-1 mb-2">

<button id="refreshJobs" class="btn btn-outline-secondary w-100" type="button">
↻
</button>

</div>

</div>

<div id="jobsBulkBar" class="d-none alert alert-light border d-flex flex-wrap align-items-center gap-2 mb-3">
    <strong>Bulk Actions:</strong>
    <select id="bulkJobStatus" class="form-select form-select-sm" style="width:auto;">
        <option value="Active">Active</option>
        <option value="Upcoming">Upcoming</option>
        <option value="Closed">Closed</option>
    </select>
    <button id="bulkUpdateJobs" class="btn btn-sm btn-primary" type="button">Update Status</button>
    <button id="bulkDeleteJobs" class="btn btn-sm btn-danger" type="button">Delete Selected</button>
</div>

<div class="card shadow">

<div class="table-responsive">

<table class="table table-hover align-middle">

<thead class="table-primary">

<tr>

<th>
<input type="checkbox" id="selectAllJobs" class="form-check-input">
</th>

<th>Thumbnail</th>

<th>Job Title</th>

<th>Department</th>

<th>District</th>

<th>Last Date</th>

<th>Status</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="jobTable">

</tbody>

</table>

</div>

<div class="d-flex justify-content-between align-items-center p-3">

<button
id="prevPage"
class="btn btn-outline-primary">

⬅ Previous

</button>

<span id="pageInfo">

Page 1

</span>

<button
id="nextPage"
class="btn btn-outline-primary">

Next ➡

</button>

</div>

</div>

</div>

<script type="module" src="auth.js"></script>

<script type="module" src="manage-jobs.js"></script>

</body>

</html>
