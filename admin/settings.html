<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Website Settings | Arna Admin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">

</head>

<body class="bg-light">

<div class="container py-4">

<div class="d-flex justify-content-between align-items-center mb-4">

<h2>⚙️ Website Settings</h2>

<a href="dashboard.html" class="btn btn-secondary">
Dashboard
</a>

</div>

<form id="settingsForm">

<!-- GENERAL -->

<div class="card shadow mb-4">

<div class="card-header bg-primary text-white">
General Settings
</div>

<div class="card-body">

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">Website Name</label>
<input type="text" id="siteName" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Website URL</label>
<input type="url" id="siteUrl" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Logo URL</label>
<input type="text" id="siteLogo" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Favicon URL</label>
<input type="text" id="favicon" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Support Email</label>
<input type="email" id="contactEmail" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Support Phone</label>
<input type="text" id="contactPhone" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">WhatsApp</label>
<input type="text" id="whatsapp" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Support URL</label>
<input type="url" id="supportUrl" class="form-control" placeholder="https://...">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Contact Address</label>
<input type="text" id="contactAddress" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Theme Color</label>
<input type="color" id="themeColor" class="form-control form-control-color">
</div>

</div>

</div>

</div>

<!-- SOCIAL -->

<div class="card shadow mb-4">

<div class="card-header bg-success text-white">
Social Links
</div>

<div class="card-body">

<div class="row">

<div class="col-md-6 mb-3">
<label>YouTube</label>
<input type="text" id="youtube" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label>Instagram</label>
<input type="text" id="instagram" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label>Facebook</label>
<input type="text" id="facebook" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label>Telegram</label>
<input type="text" id="telegram" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label>X (Twitter)</label>
<input type="text" id="twitter" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label>LinkedIn</label>
<input type="text" id="linkedin" class="form-control">
</div>

</div>

</div>

</div>

<!-- SEO -->

<div class="card shadow mb-4">

<div class="card-header bg-warning">
SEO Settings
</div>

<div class="card-body">

<div class="mb-3">
<label>Meta Title</label>
<input type="text" id="metaTitle" class="form-control">
</div>

<div class="mb-3">
<label>Meta Description</label>
<textarea id="metaDescription" rows="3" class="form-control"></textarea>
</div>

<div class="mb-3">
<label>Meta Keywords</label>
<textarea id="metaKeywords" rows="2" class="form-control"></textarea>
</div>

<div class="mb-3">
<label>Google Analytics ID</label>
<input type="text" id="analytics" class="form-control">
</div>

<div class="mb-3">
<label>Search Console Verification</label>
<input type="text" id="searchConsole" class="form-control">
</div>

<div class="mb-3">
<label>Google AdSense Publisher ID</label>
<input type="text" id="adsense" class="form-control">
</div>

<div class="mb-3">
<label>Robots</label>

<select id="robots" class="form-select">

<option value="index,follow">
Index, Follow
</option>

<option value="noindex,nofollow">
NoIndex, NoFollow
</option>

</select>

</div>

</div>

</div>

<!-- HOMEPAGE -->

<div class="card shadow mb-4">

<div class="card-header bg-info text-white">
Homepage
</div>

<div class="card-body">

<div class="mb-3">
<label>Hero Title</label>
<input type="text" id="heroTitle" class="form-control">
</div>

<div class="mb-3">
<label>Hero Subtitle</label>
<textarea id="heroSubtitle" rows="2" class="form-control"></textarea>
</div>

<div class="mb-3">
<label>Footer Text</label>
<textarea id="footerText" rows="2" class="form-control"></textarea>
</div>

<div class="form-check form-switch">

<input
class="form-check-input"
type="checkbox"
id="maintenance">

<label class="form-check-label">
Maintenance Mode
</label>

</div>

</div>

</div>

<button class="btn btn-primary btn-lg">
💾 Save Settings
</button>

</form>

</div>

<script type="module" src="settings.js"></script>
<script type="module" src="auth.js"></script>

</body>
</html>
