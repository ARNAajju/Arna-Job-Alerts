<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Admin Assistant | Arna Admin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">

</head>

<body class="bg-light">

<div class="container py-4">

<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">

<h2>AI Admin Assistant</h2>

<div class="d-flex gap-2">
<a href="ai-scanner.html" class="btn btn-outline-primary">AI Scanner</a>
<a href="dashboard.html" class="btn btn-secondary">Dashboard</a>
</div>

</div>

<!-- PDF UPLOAD -->

<div class="card shadow mb-4">

<div class="card-header bg-primary text-white">
PDF Notification Extractor
</div>

<div class="card-body">

<div class="row g-3 align-items-end">

<div class="col-md-8">
<label class="form-label" for="pdfFile">Upload Notification PDF</label>
<input
type="file"
id="pdfFile"
class="form-control"
accept="application/pdf">
<div class="form-text" id="pdfFileName"></div>
</div>

<div class="col-md-4">
<button type="button" id="extractBtn" class="btn btn-primary w-100">
Extract with AI
</button>
</div>

</div>

<div id="extractStatus" class="mt-3 small text-muted"></div>

</div>

</div>

<form id="aiJobForm">

<!-- JOB FIELDS -->

<div class="card shadow mb-4">

<div class="card-header bg-dark text-white">
Job Details
</div>

<div class="card-body">

<div class="row g-3">

<div class="col-md-6">
<label class="form-label" for="title">Title</label>
<input type="text" id="title" class="form-control" required>
</div>

<div class="col-md-6">
<label class="form-label" for="department">Department</label>
<input type="text" id="department" class="form-control">
</div>

<div class="col-md-4">
<label class="form-label" for="category">Category</label>
<select id="category" class="form-select">
<option value="">Select Category</option>
<option>AP Government</option>
<option>TS Government</option>
<option>Central Government</option>
<option>Railway</option>
<option>Bank</option>
<option>Police</option>
<option>Teaching</option>
<option>Medical</option>
<option>Defence</option>
<option>Forest</option>
<option>Agriculture</option>
<option>Revenue</option>
<option>Panchayat</option>
<option>Municipality</option>
<option>Private</option>
<option>Walk-in</option>
<option>Contract</option>
<option>Apprenticeship</option>
</select>
</div>

<div class="col-md-4">
<label class="form-label" for="state">State</label>
<select id="state" class="form-select">
<option value="">Select State</option>
<option value="AP">Andhra Pradesh</option>
<option value="TS">Telangana</option>
<option value="Central">Central</option>
<option value="Other">Other States</option>
</select>
</div>

<div class="col-md-4">
<label class="form-label" for="district">District</label>
<select id="district" class="form-select">
<option value="">Select District</option>
</select>
</div>

<div class="col-md-4">
<label class="form-label" for="qualification">Qualification</label>
<input type="text" id="qualification" class="form-control">
</div>

<div class="col-md-4">
<label class="form-label" for="salary">Salary / Pay Scale</label>
<input type="text" id="salary" class="form-control">
</div>

<div class="col-md-4">
<label class="form-label" for="ageLimit">Age Limit</label>
<input type="text" id="ageLimit" class="form-control">
</div>

<div class="col-md-4">
<label class="form-label" for="applicationFee">Application Fee</label>
<input type="text" id="applicationFee" class="form-control">
</div>

<div class="col-md-4">
<label class="form-label" for="lastDate">Last Date</label>
<input type="date" id="lastDate" class="form-control">
</div>

<div class="col-md-4">
<label class="form-label" for="status">Status</label>
<select id="status" class="form-select">
<option value="Draft">Draft</option>
<option value="Scheduled">Scheduled</option>
<option value="Active">Active</option>
</select>
</div>

<div class="col-12">
<label class="form-label" for="description">Description / About</label>
<textarea id="description" class="form-control" rows="4"></textarea>
</div>

<div class="col-12">
<label class="form-label" for="selectionProcess">Selection Process</label>
<textarea id="selectionProcess" class="form-control" rows="3"></textarea>
</div>

<div class="col-md-6">
<label class="form-label" for="officialWebsite">Official Website</label>
<input type="url" id="officialWebsite" class="form-control" placeholder="https://...">
</div>

<div class="col-md-6">
<label class="form-label" for="apply">Apply Link</label>
<input type="url" id="apply" class="form-control" placeholder="https://...">
</div>

<div class="col-md-6">
<label class="form-label" for="notification">Notification PDF URL</label>
<input type="text" id="notification" class="form-control" placeholder="Cloudinary / official PDF link">
</div>

<div class="col-md-6">
<label class="form-label" for="featured">Featured</label>
<select id="featured" class="form-select">
<option value="false">No</option>
<option value="true">Yes</option>
</select>
</div>

<div class="col-md-6">
<label class="form-label" for="sponsored">Sponsored</label>
<select id="sponsored" class="form-select">
<option value="false">No</option>
<option value="true">Yes</option>
</select>
</div>

</div>

</div>

</div>

<!-- SEO -->

<div class="card shadow mb-4">

<div class="card-header bg-warning">
SEO
</div>

<div class="card-body">

<div class="row g-3">

<div class="col-md-6">
<label class="form-label" for="seoTitle">SEO Title</label>
<input type="text" id="seoTitle" class="form-control">
</div>

<div class="col-md-6">
<label class="form-label" for="slug">Slug</label>
<input type="text" id="slug" class="form-control">
</div>

<div class="col-12">
<label class="form-label" for="seoDescription">SEO Description</label>
<textarea id="seoDescription" class="form-control" rows="2"></textarea>
</div>

<div class="col-md-6">
<label class="form-label" for="seoKeywords">SEO Keywords</label>
<input type="text" id="seoKeywords" class="form-control" placeholder="comma separated">
</div>

<div class="col-md-6">
<label class="form-label" for="tags">Tags</label>
<input type="text" id="tags" class="form-control" placeholder="comma separated">
</div>

</div>

</div>

</div>

<!-- MEDIA COPY -->

<div class="card shadow mb-4">

<div class="card-header bg-success text-white">
Media Copy
</div>

<div class="card-body">

<div class="row g-3">

<div class="col-md-6">
<label class="form-label" for="instagramCaption">Instagram Caption</label>
<textarea id="instagramCaption" class="form-control" rows="3"></textarea>
</div>

<div class="col-md-6">
<label class="form-label" for="telegramMessage">Telegram Message</label>
<textarea id="telegramMessage" class="form-control" rows="3"></textarea>
</div>

<div class="col-md-6">
<label class="form-label" for="whatsappMessage">WhatsApp Message</label>
<textarea id="whatsappMessage" class="form-control" rows="3"></textarea>
</div>

<div class="col-md-6">
<label class="form-label" for="facebookPost">Facebook Post</label>
<textarea id="facebookPost" class="form-control" rows="3"></textarea>
</div>

<div class="col-md-6">
<label class="form-label" for="twitterPost">Twitter / X Post</label>
<textarea id="twitterPost" class="form-control" rows="3"></textarea>
</div>

<div class="col-md-6">
<label class="form-label" for="youtubeTitle">YouTube Title</label>
<input type="text" id="youtubeTitle" class="form-control">
</div>

<div class="col-12">
<label class="form-label" for="youtubeDescription">YouTube Description</label>
<textarea id="youtubeDescription" class="form-control" rows="3"></textarea>
</div>

<div class="col-12">
<label class="form-label" for="thumbnailPrompt">Thumbnail Prompt</label>
<textarea id="thumbnailPrompt" class="form-control" rows="2"></textarea>
</div>

<div class="col-12">
<label class="form-label" for="blogArticle">Blog Article</label>
<textarea id="blogArticle" class="form-control" rows="6"></textarea>
</div>

</div>

</div>

</div>

<!-- ACTIONS -->

<div class="card shadow mb-4">

<div class="card-header bg-info text-white">
Publish Actions
</div>

<div class="card-body">

<div class="row g-3 align-items-end">

<div class="col-md-4">
<label class="form-label" for="scheduleAt">Schedule Publish</label>
<input type="datetime-local" id="scheduleAt" class="form-control">
</div>

<div class="col-md-8">
<div class="d-flex flex-wrap gap-2">
<button type="button" id="generateMediaBtn" class="btn btn-outline-success">
Generate Media Copy
</button>
<button type="button" id="saveDraftBtn" class="btn btn-secondary">
Save Draft
</button>
<button type="button" id="scheduleBtn" class="btn btn-warning">
Schedule Publish
</button>
<button type="button" id="publishBtn" class="btn btn-primary">
One-Click Publish
</button>
</div>
</div>

</div>

<div id="actionStatus" class="mt-3 small text-muted"></div>

</div>

</div>

</form>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.js"></script>
<script type="module" src="auth.js"></script>
<script type="module" src="ai-assistant.js"></script>

</body>
</html>
