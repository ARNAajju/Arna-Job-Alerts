<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Scanner | Arna Admin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">

</head>

<body class="bg-light">

<div class="container py-4">

<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">

<h2>AI Job Source Scanner</h2>

<div class="d-flex gap-2">
<a href="ai-assistant.html" class="btn btn-outline-primary">AI Assistant</a>
<a href="dashboard.html" class="btn btn-secondary">Dashboard</a>
</div>

</div>

<div class="card shadow mb-4">

<div class="card-header bg-primary text-white">
Official Sources
</div>

<div class="card-body">

<div class="table-responsive mb-3">
<table class="table table-sm table-bordered align-middle mb-0">
<thead class="table-light">
<tr>
<th>Source</th>
<th>Official URL</th>
</tr>
</thead>
<tbody id="sourcesTable"></tbody>
</table>
</div>

<button type="button" id="scanBtn" class="btn btn-primary">
Scan Sources
</button>

<div id="scanStatus" class="mt-3 small text-muted"></div>

</div>

</div>

<div class="card shadow mb-4">

<div class="card-header bg-secondary text-white">
Manual Register
</div>

<div class="card-body">

<div class="row g-3 align-items-end">

<div class="col-md-3">
<label class="form-label" for="manualSource">Source</label>
<select id="manualSource" class="form-select"></select>
</div>

<div class="col-md-4">
<label class="form-label" for="manualTitle">Notification Title</label>
<input type="text" id="manualTitle" class="form-control" placeholder="Notification title">
</div>

<div class="col-md-3">
<label class="form-label" for="manualUrl">Notification URL</label>
<input type="url" id="manualUrl" class="form-control" placeholder="https://...">
</div>

<div class="col-md-2">
<button type="button" id="manualRegisterBtn" class="btn btn-success w-100">
Register
</button>
</div>

</div>

</div>

</div>

<div class="card shadow mb-4">

<div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
<span>Scanner Alerts</span>
<span class="badge bg-light text-dark" id="alertCount">0</span>
</div>

<div class="card-body">

<div class="table-responsive">
<table class="table table-bordered table-hover align-middle">
<thead>
<tr>
<th>Source</th>
<th>Title</th>
<th>URL</th>
<th>Detected</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="alertsTable">
<tr>
<td colspan="6" class="text-center">Loading...</td>
</tr>
</tbody>
</table>
</div>

</div>

</div>

</div>

<script type="module" src="auth.js"></script>
<script type="module" src="ai-scanner.js"></script>

</body>
</html>
