<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Add Job Details</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container my-5">

<div class="card shadow-lg p-4 rounded-4">

<h2 class="mb-4">
📝 Add Job Details
</h2>

<form id="detailsForm">

<h4 class="text-primary">About Recruitment</h4>

<textarea
id="about"
class="form-control mb-4"
rows="6"></textarea>

<h4 class="text-primary">Vacancy Details</h4>

<textarea
id="vacancies"
class="form-control mb-4"
rows="5"></textarea>

<h4 class="text-primary">Qualification Details</h4>

<textarea
id="qualificationDetails"
class="form-control mb-4"
rows="5"></textarea>

<h4 class="text-primary">Age Limit</h4>

<textarea
id="ageLimit"
class="form-control mb-4"
rows="3"></textarea>

<h4 class="text-primary">Selection Process</h4>

<textarea
id="selectionProcess"
class="form-control mb-4"
rows="4"></textarea>

<h4 class="text-primary">Application Fee</h4>

<textarea
id="applicationFee"
class="form-control mb-4"
rows="3"></textarea>

<h4 class="text-primary">Important Dates</h4>

<textarea
id="importantDates"
class="form-control mb-4"
rows="4"></textarea>

<h4 class="text-primary">How To Apply</h4>

<textarea
id="howToApply"
class="form-control mb-4"
rows="5"></textarea>

<h4 class="text-primary">Important Instructions</h4>

<textarea
id="instructions"
class="form-control mb-4"
rows="5"></textarea>

<input
class="form-control mb-3"
id="notificationPdf"
placeholder="Notification PDF Link">

<input
class="form-control mb-3"
id="officialWebsite"
placeholder="Official Website">

<input
class="form-control mb-3"
id="instagram"
placeholder="Instagram Reel Link">

<input
class="form-control mb-3"
id="youtube"
placeholder="YouTube Video Link">

<button class="btn btn-success w-100">

Publish Details

</button>

</form>

</div>

</div>

<script type="module" src="auth.js"></script>

</body>

</html>
