<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Job | Arna Admin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">

</head>

<body class="bg-light">

<div class="container py-4">

<div class="d-flex justify-content-between align-items-center mb-4">

<h2 class="fw-bold">
➕ Add / Edit Job
</h2>

<a href="dashboard.html"
class="btn btn-secondary">

Dashboard

</a>

</div>

<div class="card shadow">

<div class="card-body">

<form id="jobForm">

<div class="row g-3">

<div class="col-md-6">

<label class="form-label">
Job Title *
</label>

<input
type="text"
id="title"
class="form-control"
required>

</div>

<div class="col-md-6">

<label class="form-label">
Department *
</label>

<input
type="text"
id="department"
class="form-control"
required>

</div>

<div class="col-md-4">

<label class="form-label">
Category
</label>

<select
id="category"
class="form-select"
required>

<option value="">Select Category</option>

<optgroup label="Government">

<option>AP Government</option>

<option>TS Government</option>

<option>Central Government</option>

</optgroup>

<optgroup label="Department">

<option>Railway</option>

<option>Bank</option>

<option>Police</option>

<option>Teaching</option>

<option>Medical</option>

<option>Defence</option>

<option>Forest</option>

<option>Agriculture</option>

<option>Revenue</option>

<option>Panchayat</option>

<option>Municipality</option>

</optgroup>

<optgroup label="Other">

<option>Private</option>

<option>Walk-in</option>

<option>Contract</option>

<option>Apprenticeship</option>

</optgroup>

</select>

</div>

<div class="col-md-4">

<div class="col-md-4">

<label class="form-label">

State

</label>

<select
id="state"
class="form-select"
required>

<option value="">Select State</option>

<option value="AP">Andhra Pradesh</option>

<option value="TS">Telangana</option>

<option value="Central">Central</option>

<option value="Other">Other States</option>

</select>

</div>

<div class="col-md-4">

<label class="form-label">

District

</label>

<select
id="district"
class="form-select"
required>

<option value="">Select District</option>

</select>

</div>

</div>

<div class="col-md-4">

<label class="form-label">
Qualification *
</label>

<input
type="text"
id="qualification"
class="form-control"
required>

</div>

<div class="col-md-4">

<label class="form-label">
Salary *
</label>

<input
type="text"
id="salary"
class="form-control"
required>

</div>

<div class="col-md-4">

<label class="form-label">
Last Date *
</label>

<div class="col-md-4">

<label class="form-label">

Status

</label>

<div class="col-md-4">

<label class="form-label">

Featured Job

</label>

<select
id="featured"
class="form-select">

<option value="false">

Normal

</option>

<option value="true">

Featured

</option>

</select>

</div>

<div class="col-md-4">

<label class="form-label">

Urgent Job

</label>

<select
id="urgent"
class="form-select">

<option value="false">

No

</option>

<option value="true">

Yes

</option>

</select>

</div>

<select
id="status"
class="form-select">

<option value="Active">Active</option>

<option value="Upcoming">Upcoming</option>

<option value="Closed">Closed</option>

</select>

</div>

<input
type="date"
id="lastDate"
class="form-control"
required>

</div>

<div class="col-md-4">

<label class="form-label">
Featured
</label>

<select
id="featured"
class="form-select">

<option value="false">
No
</option>

<option value="true">
Yes
</option>

</select>

</div>

<div class="col-12">

<label class="form-label">
Thumbnail
</label>

<input
type="file"
id="thumbnailFile"
class="form-control"
accept="image/*">

</div>

<div class="col-md-6">

<label class="form-label">
Apply Link
</label>

<input
type="url"
id="apply"
class="form-control">

</div>

<div class="col-md-6">

<label class="form-label">
Notification PDF
</label>

<input
type="url"
id="notification"
class="form-control">

</div>

<div class="col-md-6">

<label class="form-label">
YouTube Link
</label>

<input
type="url"
id="youtube"
class="form-control">

</div>

<div class="col-md-6">

<label class="form-label">
Instagram Link
</label>

<input
type="url"
id="instagram"
class="form-control">

</div>

<div class="col-12">

<label class="form-label">
About Job
</label>

<textarea
id="about"
rows="4"
class="form-control"></textarea>

</div>

<div class="col-md-6">

<label class="form-label">
Vacancies
</label>

<input
type="text"
id="vacancies"
class="form-control">

</div>

<div class="col-md-6">

<label class="form-label">
Qualification Details
</label>

<input
type="text"
id="qualificationDetails"
class="form-control">

</div>

<div class="col-12">

<label class="form-label">
Selection Process
</label>

<textarea
id="selectionProcess"
rows="3"
class="form-control"></textarea>

</div>

<div class="col-12">

<label class="form-label">
Important Dates
</label>

<textarea
id="importantDates"
rows="3"
class="form-control"></textarea>

</div>

<div class="col-12">

<label class="form-label">
How to Apply
</label>

<textarea
id="howToApply"
rows="3"
class="form-control"></textarea>

</div>

<div class="col-12">

<label class="form-label">
Official Website
</label>

<input
type="url"
id="officialWebsite"
class="form-control">

</div>

<div class="col-12">

<button
type="submit"
class="btn btn-success w-100">

Publish Job

</button>

</div>

</div>

</form>

</div>

</div>

</div>

<script type="module" src="auth.js"></script>
<script type="module" src="add-job.js"></script>

</body>

</html>
