<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Edit Job</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow-lg p-4">

<h2 class="mb-4">
✏ Edit Job
</h2>

<form id="editForm">

<input class="form-control mb-3" id="title" placeholder="Job Title">

<input class="form-control mb-3" id="department" placeholder="Department">

<input class="form-control mb-3" id="category" placeholder="Category">

<input class="form-control mb-3" id="state" placeholder="State">

<input class="form-control mb-3" id="district" placeholder="District">

<input class="form-control mb-3" id="qualification" placeholder="Qualification">

<input class="form-control mb-3" id="salary" placeholder="Salary">

<input class="form-control mb-3" id="lastDate" type="date">

<input class="form-control mb-3" id="apply" placeholder="Direct Apply Link">

<input class="form-control mb-3" id="youtube" placeholder="YouTube Link">

<input class="form-control mb-3" id="thumbnail" placeholder="Thumbnail URL">

<button class="btn btn-success w-100">

💾 Update Job

</button>

</form>

</div>

</div>

<script type="module" src="auth.js"></script>

</body>

</html>
